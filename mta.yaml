_schema-version: 3.3.0
ID: sap-insight-copilot
version: 1.0.0
parameters:
  enable-parallel-deployments: true

modules:
  - name: sap-insight-copilot-srv
    type: nodejs
    path: cap
    parameters:
      memory: 512M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: npm

  - name: sap-insight-copilot-web
    type: nodejs
    path: app
    parameters:
      memory: 512M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: insight-srv
          url: ~{srv-url}
          forwardAuthToken: true
    build-parameters:
      builder: npm
